# SonarQube — local shared instance in ~/projects/sonarqube (Docker, not in CI).
# The token is NOT here: it comes from SONAR_TOKEN (env), read by the scanner.

sonar.projectKey=flightlog
sonar.projectName=Flightlog
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

sonar.sources=app,lib,components,scripts,worker
sonar.tests=lib,worker
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/*.test.ts,lib/database.types.ts,.next/**,coverage/**,data/**,public/**,**/*.config.*

# lib/database.types.ts is generated by `supabase gen types` (S6571 on its unions).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage is measured on the pure logic `bun test` covers (lib/, worker/). Pages, the map component
# and the one-off data scripts are checked by hand: `bun test` has no DOM runner.
sonar.coverage.exclusions=app/**,components/**,scripts/**

# The en and it dictionaries have the same keys by design: CPD ignores literals and reads them as clones.
sonar.cpd.exclusions=lib/i18n.ts
